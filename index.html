<style>
  :root{
    --asphalt-900:#14181d; --asphalt-800:#1b2027; --asphalt-700:#242b33;
    --line-yellow:#ffc53d; --line-yellow-dim:#8a6a1f;
    --text-primary:#edeef0; --text-secondary:#8b929c;
    --border:#2c333c; --danger:#e35a5e;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--asphalt-900); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding-inline:0;}
  .wrap{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px;}
  .logo{font-weight:800; font-size:26px; letter-spacing:.02em; margin-bottom:4px;}
  .logo span{color:var(--line-yellow-dim);}
  .tag{color:var(--text-secondary); font-size:13px; margin-bottom:28px; text-align:center;}
  form{width:100%; display:flex; flex-direction:column; gap:12px;}
  input,select{background:var(--asphalt-800); border:1px solid var(--border); color:var(--text-primary); border-radius:10px; padding:13px 14px; font-size:15px; width:100%;}
  input:focus,select:focus{outline:none; border-color:var(--line-yellow);}
  button{background:var(--line-yellow); color:#241c04; border:none; border-radius:10px; padding:13px 14px; font-size:15px; font-weight:700; cursor:pointer;}
  button:disabled{opacity:.6; cursor:default;}
  .err{color:var(--danger); font-size:13.5px; min-height:18px;}
  .top{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); padding-top:calc(16px + env(safe-area-inset-top, 0px));}
  .top .co{font-size:15px; font-weight:700;}
  .top .role{color:var(--text-secondary); font-size:12.5px; margin-top:2px;}
  .sair{background:transparent; color:var(--text-secondary); border:1px solid var(--border); padding:8px 12px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;}
  .content{padding:18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); flex:1;}
  h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--line-yellow); margin:22px 0 10px; font-weight:700;}
  h3:first-child{margin-top:0;}
  .card{background:var(--asphalt-800); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:8px;}
  .card .l1{font-weight:700; font-size:14.5px; display:flex; align-items:center;}
  .card .l2{color:var(--text-secondary); font-size:13px; margin-top:2px;}
  .pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:100px; background:var(--asphalt-700); color:var(--text-secondary); margin-left:8px; font-weight:600;}
  .pill.ok{background:rgba(63,178,127,.15); color:#3fb27f;}
  .pill.vence_em_breve{background:rgba(255,197,61,.15); color:var(--line-yellow);}
  .pill.vencido{background:rgba(227,90,94,.15); color:var(--danger);}
  .status{color:var(--text-secondary); font-size:14px; text-align:center; padding:40px 20px;}
  .tabs{display:flex; gap:4px; padding:0 20px; border-bottom:1px solid var(--border);}
  .tab{background:transparent; border:none; color:var(--text-secondary); font-size:13.5px; font-weight:600; padding:12px 4px; cursor:pointer; border-bottom:2px solid transparent; border-radius:0;}
  .tab.active{color:var(--line-yellow); border-bottom-color:var(--line-yellow);}
  .card .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .btn-small{background:var(--asphalt-700); color:var(--text-primary); border:1px solid var(--border); padding:8px 12px; font-size:12.5px; font-weight:600; border-radius:8px; cursor:pointer;}
  .file-label{background:var(--asphalt-700); color:var(--text-primary); border:1px solid var(--border); padding:8px 12px; font-size:12.5px; font-weight:600; border-radius:8px; cursor:pointer; display:inline-block;}
  .file-label input{display:none;}
  .card.clickable{cursor:pointer;}
  .backbtn{background:transparent; border:none; color:var(--text-secondary); font-size:13.5px; font-weight:600; padding:4px 0; margin-bottom:6px; cursor:pointer;}
  .ans-row{display:flex; gap:6px; margin-top:10px;}
  .ans-btn{flex:1; background:var(--asphalt-700); border:1px solid var(--border); color:var(--text-secondary); font-size:11.5px; font-weight:600; padding:9px 4px; border-radius:8px; cursor:pointer; text-align:center;}
  .ans-btn.active.ok{background:#3fb27f; border-color:#3fb27f; color:#fff;}
  .ans-btn.active.bad{background:var(--danger); border-color:var(--danger); color:#fff;}
  .ans-btn.active.na{background:#b9a9e8; border-color:#b9a9e8; color:#2c2440;}
  .progress{position:sticky; top:0; background:var(--asphalt-900); padding:12px 0; margin-top:-4px; z-index:2; border-bottom:1px solid var(--border); margin-bottom:12px;}
  .list-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .li-ic{width:34px; height:34px; border-radius:9px; background:var(--asphalt-700); display:flex; align-items:center; justify-content:center; color:var(--line-yellow); flex-shrink:0;}
  .li-body{flex:1; min-width:0;}
  .li-title{color:var(--text-primary); font-size:13.5px; font-weight:700;}
  .li-sub{color:var(--text-secondary); font-size:12px; margin-top:1px;}
  .chev{color:var(--text-secondary); font-size:18px;}
  .greeting{font-size:20px; font-weight:800; margin-bottom:2px;}
  .greeting-sub{color:var(--text-secondary); font-size:13px; margin-bottom:18px;}
  .alert-card{background:var(--asphalt-800); border:1px solid var(--border); border-left:4px solid var(--line-yellow); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
  .alert-card.vencido{border-left-color:var(--danger);}
  .alert-card .l1{font-weight:700; font-size:13.5px;}
  .alert-card .l2{color:var(--text-secondary); font-size:12px; margin-top:2px;}
  .quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px;}
  .quick-tile{background:var(--asphalt-800); border:1px solid var(--border); border-radius:12px; padding:16px 12px; text-align:center; cursor:pointer;}
  .quick-tile .qi{font-size:22px; margin-bottom:6px; line-height:1;}
  .quick-tile .qt{font-size:12.5px; font-weight:700;}
  .quick-tile .qs{font-size:11px; color:var(--text-secondary); margin-top:2px;}
  .bottom-nav{display:flex; border-top:1px solid var(--border); background:var(--asphalt-800); position:sticky; bottom:0; padding-bottom:env(safe-area-inset-bottom, 0px); z-index:3;}
  .nav-btn{flex:1; background:transparent; border:none; color:var(--text-secondary); font-size:10.5px; font-weight:600; padding:9px 2px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .nav-btn.active{color:var(--line-yellow);}
  .nav-ic{font-size:19px; line-height:1;}
  .gauge-wrap{display:flex; align-items:center; gap:14px;}
  .gauge-txt{flex:1;}
  .gauge-num{font-size:19px; font-weight:800;}
  .gauge-sub{color:var(--text-secondary); font-size:12px; margin-top:1px;}
</style>

function attachLoginHandlers(){
  document.getElementById('loginForm').addEventListener('submit', doLogin);
}

async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    loginError = error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message;
    render();
    return;
  }
  loginError = '';
  session = data.session;
  render();
}

async function doLogout(){
  await sb.auth.signOut();
  session = null;
  usuarioAtual = null;
  meuConjunto = null;
  motoristaScreen = 'home';
  motoristaTab = 'inicio';
  chkAnswers = {};
  jornadaEmEdicaoId = null;
  motivoSelecionado = null;
  jornadaDetalheId = null;
  documentosSubtela = 'lista';
  screen = 'painel';
  render();
}

const papelLabel = { admin_transportadora:'Administrador', gestor:'Escritório', mecanico:'Mecânico', motorista:'Motorista', admin_mover_ia:'MOVER.IA' };
const statusLabel = { ok:'Em dia', vence_em_breve:'Vence em breve', vencido:'Vencido' };

async function loadShell(){
  if(!usuarioAtual){
    const { data: usuario, error: uErr } = await sb
      .from('usuario')
      .select('nome, papel, transportadora_id, senha_temporaria, transportadora:transportadora_id ( nome_fantasia, plano )')
      .eq('id', session.user.id)
      .single();

    if(uErr || !usuario){
      app.innerHTML = `<div class="wrap"><div class="content"><div class="status">Login funcionou, mas não encontrei seu cadastro na tabela "usuario". ${uErr ? '('+uErr.message+')' : ''}</div></div></div>`;
      return;
    }
    usuarioAtual = usuario;
  }

  if(usuarioAtual.papel === 'motorista' && usuarioAtual.senha_temporaria){ loadPrimeiroAcessoMotorista(); return; }
  if(usuarioAtual.papel === 'motorista'){ loadShellMotorista(); return; }

  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <div class="co">${usuarioAtual.transportadora ? usuarioAtual.transportadora.nome_fantasia : '—'}</div>
          <div class="role">${usuarioAtual.nome} · ${papelLabel[usuarioAtual.papel] || usuarioAtual.papel}</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="tabs">
        <button class="tab ${screen==='painel'?'active':''}" data-screen="painel">Painel</button>
        <button class="tab ${screen==='documentos'?'active':''}" data-screen="documentos">Documentos</button>
      </div>
      <div class="content" id="screenContent"><div class="status">Carregando...</div></div>
    </div>`;

  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    screen = el.dataset.screen;
    documentosSubtela = 'lista';
    loadShell();
  }));

  if(screen === 'painel') loadPainel();
  else if(screen === 'documentos') loadDocumentos();
}

// Primeiro acesso de um motorista cadastrado automaticamente (login criado
// ao enviar a CNH dele): confirma a identidade pelo CPF (quando o app
// conseguiu ler o CPF do documento) e obriga a trocar a senha temporária
// antes de liberar o resto do app.
async function loadPrimeiroAcessoMotorista(){
  const { data: perfil } = await sb.from('motorista_perfil').select('cpf').eq('usuario_id', session.user.id).maybeSingle();
  const cpfCadastrado = perfil ? perfil.cpf : null;

  app.innerHTML = `
    <div class="wrap">
      <div class="center">
        <div class="logo" style="font-size:20px;">Bem-vindo, ${usuarioAtual.nome.split(' ')[0]}</div>
        <div class="tag">Primeiro acesso — confirme seus dados e crie sua senha</div>
        <form id="primeiroAcessoForm">
          ${cpfCadastrado ? `<input type="text" id="paCpf" placeholder="Confirme seu CPF" required inputmode="numeric">` : ''}
          <input type="password" id="paSenha1" placeholder="Nova senha (mín. 6 caracteres)" required minlength="6">
          <input type="password" id="paSenha2" placeholder="Confirme a nova senha" required minlength="6">
          <div class="err" id="paErr"></div>
          <button type="submit" id="paBtn">Confirmar e entrar</button>
        </form>
      </div>
    </div>`;

  document.getElementById('primeiroAcessoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('paErr');
    errEl.textContent = '';
    const senha1 = document.getElementById('paSenha1').value;
    const senha2 = document.getElementById('paSenha2').value;

    if(cpfCadastrado){
      const cpfDigitado = document.getElementById('paCpf').value.replace(/\D/g, '');
      const cpfSalvo = cpfCadastrado.replace(/\D/g, '');
      if(cpfDigitado !== cpfSalvo){ errEl.textContent = 'CPF não confere com o que temos cadastrado.'; return; }
    }
    if(senha1.length < 6){ errEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
    if(senha1 !== senha2){ errEl.textContent = 'As senhas não são iguais.'; return; }

    const btn = document.getElementById('paBtn');
    btn.disabled = true; btn.textContent = 'Salvando...';

    const { error: erroSenha } = await sb.auth.updateUser({ password: senha1 });
    if(erroSenha){ errEl.textContent = 'Erro ao trocar a senha: ' + erroSenha.message; btn.disabled = false; btn.textContent = 'Confirmar e entrar'; return; }

    await sb.from('usuario').update({ senha_temporaria: false }).eq('id', session.user.id);
    usuarioAtual.senha_temporaria = false;
    loadShell();
  });
}

let meuConjunto = null;
let motoristaScreen = 'home';
let motoristaTab = 'inicio';
let chkAnswers = {};
let chkObs = {};

async function carregarMeuConjunto(){
  if(meuConjunto !== null) return meuConjunto;
  const { data: conjuntos } = await sb
    .from('conjunto')
    .select('id, conjunto_item(ordem, veiculo_id, veiculo:veiculo_id(placa, tipo))')
    .eq('motorista_id', session.user.id);
  meuConjunto = (conjuntos && conjuntos[0]) || false;
  return meuConjunto;
}

const MOTIVOS_PARADA = [
  'Parado na garagem',
  'Parada no posto',
  'Chegada no local de carregamento',
  'Em carregamento',
  'Chegada no local de descarga',
  'Em descarga',
  'Pausa para alimentação',
  'Pausa para manutenção',
  'Outro'
];

let jornadaEmEdicaoId = null;
let motivoSelecionado = null;
let jornadaDetalheId = null;

async function carregarJornadaAtiva(){
  const { data } = await sb.from('jornada')
    .select('id, inicio, status')
    .eq('motorista_id', session.user.id)
    .neq('status', 'encerrada')
    .order('inicio', { ascending: false })
    .limit(1);
  const jornada = (data && data[0]) || null;
  if(jornada && jornada.status === 'pausada'){
    const { data: ultimoEvento } = await sb.from('jornada_evento')
      .select('motivo')
      .eq('jornada_id', jornada.id)
      .eq('tipo', 'pausa')
      .order('criado_em', { ascending: false })
      .limit(1);
    jornada.motivoAtual = (ultimoEvento && ultimoEvento[0] && ultimoEvento[0].motivo) || null;
  }
  return jornada;
}

const jornadaStatusLabel = { ativa: 'Em andamento', pausada: 'Pausada' };

function jornadaBotoes(jornada){
  if(!jornada) return `<button id="btnJornadaIniciar" style="margin-top:14px; width:100%;">Iniciar jornada</button>`;
  if(jornada.status === 'ativa') return `
    <div class="ans-row">
      <button class="ans-btn" id="btnJornadaPausar" style="flex:1;">Registrar parada</button>
      <button class="ans-btn bad" id="btnJornadaEncerrar" style="flex:1;">Encerrar</button>
    </div>`;
  return `
    <div class="ans-row">
      <button class="ans-btn ok" id="btnJornadaRetomar" style="flex:1;">Retomar</button>
      <button class="ans-btn bad" id="btnJornadaEncerrar" style="flex:1;">Encerrar</button>
    </div>`;
}

function attachJornadaHandlers(jornada){
  const ini = document.getElementById('btnJornadaIniciar');
  if(ini) ini.addEventListener('click', iniciarJornada);
  const pausar = document.getElementById('btnJornadaPausar');
  if(pausar) pausar.addEventListener('click', () => { jornadaEmEdicaoId = jornada.id; motoristaScreen = 'jornadaPausa'; loadShellMotorista(); });
  const retomar = document.getElementById('btnJornadaRetomar');
  if(retomar) retomar.addEventListener('click', () => atualizarJornada(jornada.id, 'ativa', 'retomada'));
  const encerrar = document.getElementById('btnJornadaEncerrar');
  if(encerrar) encerrar.addEventListener('click', () => { jornadaEmEdicaoId = jornada.id; motoristaScreen = 'jornadaEncerrar'; loadShellMotorista(); });
}

async function iniciarJornada(){
  const { data, error } = await sb.from('jornada').insert({
    transportadora_id: usuarioAtual.transportadora_id,
    motorista_id: session.user.id,
    status: 'ativa'
  }).select('id').single();
  if(error){ alert('Erro ao iniciar jornada: ' + error.message); return; }
  await sb.from('jornada_evento').insert({ jornada_id: data.id, tipo: 'inicio' });
  loadShellMotorista();
}

async function atualizarJornada(jornadaId, novoStatus, tipoEvento){
  const { error } = await sb.from('jornada').update({ status: novoStatus }).eq('id', jornadaId);
  if(error){ alert('Erro: ' + error.message); return; }
  await sb.from('jornada_evento').insert({ jornada_id: jornadaId, tipo: tipoEvento });
  loadShellMotorista();
}

async function loadJornadaEncerrar(){
  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <button class="backbtn" id="btnVoltar">← Voltar</button>
          <div class="co">Encerrar jornada</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="content">
        <h3>Observação final (opcional)</h3>
        <div class="card">
          <textarea id="encerrarObs" rows="3" placeholder="Alguma observação sobre a jornada?" style="width:100%; background:var(--asphalt-800); border:1px solid var(--border); color:var(--text-primary); border-radius:10px; padding:12px; font-size:14px; font-family:inherit; resize:vertical;"></textarea>
        </div>
        <h3>Assinatura do motorista</h3>
        <div class="card" style="padding:10px;">
          <canvas id="canvasAssinatura" style="width:100%; height:160px; background:var(--asphalt-700); border-radius:8px; touch-action:none; display:block;"></canvas>
          <button class="btn-small" id="btnLimparAssinatura" style="margin-top:8px;">Limpar assinatura</button>
        </div>
        <button id="btnConfirmarEncerramento" disabled>Confirmar e encerrar jornada</button>
      </div>
    </div>`;
  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.getElementById('btnVoltar').addEventListener('click', () => { motoristaScreen = 'home'; loadShellMotorista(); });

  const canvas = document.getElementById('canvasAssinatura');
  const ctx = canvas.getContext('2d');
  function ajustarCanvas(){
    const rect = canvas.getBoundingClientRect();
    const escala = window.devicePixelRatio || 1;
    canvas.width = rect.width * escala;
    canvas.height = rect.height * escala;
    ctx.scale(escala, escala);
    ctx.strokeStyle = '#edeef0';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
  }
  ajustarCanvas();

  let desenhando = false;
  function posicaoNoCanvas(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  canvas.addEventListener('pointerdown', e => {
    desenhando = true;
    document.getElementById('btnConfirmarEncerramento').disabled = false;
    const p = posicaoNoCanvas(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener('pointermove', e => {
    if(!desenhando) return;
    const p = posicaoNoCanvas(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });
  window.addEventListener('pointerup', () => { desenhando = false; });

  document.getElementById('btnLimparAssinatura').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('btnConfirmarEncerramento').disabled = true;
  });

  document.getElementById('btnConfirmarEncerramento').addEventListener('click', () => confirmarEncerramento(canvas));
}

async function salvarAbastecimento(e, veiculoId){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Salvando...';

  const km = parseFloat(document.getElementById('abKm').value);
  const litros = parseFloat(document.getElementById('abLitros').value);
  const odometroVal = document.getElementById('abOdometro').value;
  const odometro = odometroVal ? parseFloat(odometroVal) : null;

  const { data: anterior } = await sb.from('abastecimento')
    .select('km')
    .eq('veiculo_id', veiculoId)
    .order('data', { ascending: false })
    .limit(1);

  let media = null;
  if(anterior && anterior[0] && km > anterior[0].km && litros > 0){
    media = (km - anterior[0].km) / litros;
  }

  const { error } = await sb.from('abastecimento').insert({
    transportadora_id: usuarioAtual.transportadora_id,
    motorista_id: session.user.id,
    veiculo_id: veiculoId,
    km,
    litros,
    odometro_bomba: odometro,
    media_calculada: media
  });

  if(error){ alert('Erro ao salvar abastecimento: ' + error.message); btn.disabled = false; btn.textContent = 'Salvar abastecimento'; return; }

  alert(media ? `Abastecimento salvo! Consumo médio: ${media.toFixed(2)} km/l` : 'Abastecimento salvo!');
  loadShellMotorista();
}

function formatarDuracao(inicioIso, fimIso){
  const ms = new Date(fimIso) - new Date(inicioIso);
  const totalMin = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h${String(m).padStart(2,'0')}`;
}

let qrStreamAtivo = null;

async function abrirScannerQR(docId, onSalvo){
  const modalHtml = `
    <div id="qrModal" style="position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column;">
      <video id="qrVideo" autoplay playsinline muted style="flex:1; object-fit:cover; width:100%; min-height:0;"></video>
      <div style="padding:16px; background:var(--asphalt-900);">
        <div id="qrStatus" class="l2" style="text-align:center; margin-bottom:10px;">Aponte a câmera para o QR Code do documento</div>
        <button id="btnFecharQR" style="width:100%;">Cancelar</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);

  const video = document.getElementById('qrVideo');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let ativo = true;

  function fecharScanner(){
    ativo = false;
    if(qrStreamAtivo){ qrStreamAtivo.getTracks().forEach(t => t.stop()); qrStreamAtivo = null; }
    const modal = document.getElementById('qrModal');
    if(modal) modal.remove();
  }
  document.getElementById('btnFecharQR').addEventListener('click', fecharScanner);

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('Este navegador não permite usar a câmera aqui. Tente pelo celular, em um site https.');
    fecharScanner();
    return;
  }

  try{
    qrStreamAtivo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch(e){
    alert('Não consegui acessar a câmera: ' + e.message);
    fecharScanner();
    return;
  }
  video.srcObject = qrStreamAtivo;

  function tick(){
    if(!ativo) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const codigo = jsQR(imageData.data, imageData.width, imageData.height);
      if(codigo && codigo.data){
        document.getElementById('qrStatus').textContent = 'QR Code lido!';
        fecharScanner();
        processarQrLido(docId, codigo.data, onSalvo);
        return;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function processarQrLido(docId, conteudo, onSalvo){
  const confirmar = confirm(`QR Code lido:\n\n${conteudo}\n\nSalvar essa informação neste documento?`);
  if(!confirmar) return;
  const { error } = await sb.from('documento').update({ qr_conteudo: conteudo }).eq('id', docId);
  if(error){ alert('Erro ao salvar QR Code: ' + error.message); return; }
  (onSalvo || (()=>{}))();
}

async function extrairTextoPdf(file){
  if(typeof pdfjsLib === 'undefined') return '';
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let texto = '';
  // Alguns documentos digitais (ex: CNH Digital) têm os dados pessoais só
  // como imagem/foto — sem texto selecionável na página. Nesses casos, o
  // título do arquivo (ex: "CNH Digital", "CRLV Digital") é a pista mais
  // confiável disponível, então incluímos ele também.
  try{
    const meta = await pdf.getMetadata();
    if(meta && meta.info && meta.info.Title) texto += meta.info.Title + '\n';
  } catch(e){ /* metadata pode não existir, segue sem ela */ }
  for(let i = 1; i <= Math.min(pdf.numPages, 3); i++){
    const pagina = await pdf.getPage(i);
    const conteudo = await pagina.getTextContent();
    texto += conteudo.items.map(it => it.str).join(' ') + '\n';
  }
  return texto;
}

function extrairDatasPossiveis(texto){
  const encontradas = texto.match(/\d{2}\/\d{2}\/\d{4}/g) || [];
  return [...new Set(encontradas)];
}

async function anexarArquivoComLeitura(docId, file, onDone){
  if(!file) return;
  if(file.type === 'application/pdf'){
    try{
      let texto = await extrairTextoPdf(file);
      let datas = extrairDatasPossiveis(texto);
      if(!datas.length){
        // PDF sem data em texto selecionável (ex: documento com dados só em
        // foto/imagem) — tenta achar a validade por OCR antes de desistir.
        mostrarStatusOcr(true, 'Lendo o documento com reconhecimento de imagem...');
        const textoOcr = await ocrArquivo(file);
        mostrarStatusOcr(false);
        if(textoOcr) datas = extrairDatasPossiveis(textoOcr);
      }
      if(datas.length) await mostrarSelecaoDeData(docId, datas);
    } catch(e){
      // se não conseguir ler o texto do PDF, segue o upload normalmente
    }
  }
  await anexarArquivo(docId, file, onDone);
}

function normalizarTexto(t){
  return (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
}

// Remove todo espaço/pontuação — PDFs costumam quebrar palavras acentuadas
// em pedaços com espaços extras no meio, então comparar "grudado" é mais confiável.
function normalizarTextoGrudado(t){
  return normalizarTexto(t).replace(/[^A-Z0-9]/g, '');
}

function detectarTipoDocumento(texto){
  const t = normalizarTextoGrudado(texto);
  // A CNH Digital emitida pelo SENATRAN não traz o nome/número em texto
  // selecionável (é uma foto/imagem) — só o cabeçalho padrão do documento
  // e o título do arquivo, por isso os sinais abaixo miram nesse texto fixo.
  if(t.includes('HABILITACAO') || t.includes('DRIVERLICENSE') || t.includes('CARTEIRANACIONALDETRANSITO')
     || t.includes('CNHDIGITAL') || t.includes('ASSINADORSERPRO')) return { referenteA: 'motorista', tipo: 'CNH' };
  if(t.includes('LICENCIAMENTODEVEICULO') || t.includes('CRLV') || t.includes('CERTIFICADODEREGISTRO')
     || t.includes('CRLVDIGITAL')) return { referenteA: 'veiculo', tipo: 'CRLV' };
  return { referenteA: null, tipo: '' };
}

function normalizarPalavras(t){
  return normalizarTexto(t).replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
}

function nomeBateExato(texto, motorista){
  if(!motorista) return false;
  const t = normalizarTextoGrudado(texto);
  return t.includes(normalizarTextoGrudado(motorista.nome));
}

function encontrarMotoristaPorNome(texto, motoristas){
  const t = normalizarTextoGrudado(texto);
  const exatos = (motoristas || []).filter(m => t.includes(normalizarTextoGrudado(m.nome)));
  if(exatos.length === 1) return exatos[0];
  if(exatos.length > 1) return null; // mais de um nome bate igual — ambíguo, não arrisca

  // Nenhum nome bateu perfeito — o OCR pode ter errado uma letra (comum em
  // nomes compostos/acentuados). Tenta por palavras do nome, exigindo a
  // maior parte delas presente como palavra inteira no texto lido.
  const palavrasTexto = new Set(normalizarPalavras(texto));
  const candidatos = (motoristas || []).map(m => {
    const palavrasNome = normalizarPalavras(m.nome).filter(p => p.length >= 3);
    if(!palavrasNome.length) return null;
    const acertos = palavrasNome.filter(p => palavrasTexto.has(p)).length;
    return { motorista: m, acertos, total: palavrasNome.length };
  }).filter(c => c && c.acertos >= Math.max(2, Math.ceil(c.total * 0.6)));

  candidatos.sort((a, b) => b.acertos - a.acertos);
  if(candidatos.length === 1) return candidatos[0].motorista;
  if(candidatos.length > 1 && candidatos[0].acertos > candidatos[1].acertos) return candidatos[0].motorista;
  return null;
}

function encontrarVeiculoPorPlaca(texto, veiculos){
  const t = normalizarTextoGrudado(texto);
  const encontrados = (veiculos || []).filter(v => t.includes(normalizarTextoGrudado(v.placa)));
  return encontrados.length === 1 ? encontrados[0] : null;
}

// Alguns documentos (como a CNH Digital) trazem o nome/validade só como foto,
// sem texto selecionável no PDF. Nesse caso, renderiza a página como imagem
// (ou usa a imagem enviada direto) e lê o texto dela por reconhecimento óptico
// (OCR), rodando inteiramente no navegador — sem enviar a imagem pra fora.
// Usa "bloco único uniforme" (PSM 6) em vez do modo automático — funciona
// bem melhor em documentos de identidade com várias colunas/campos como a
// CNH, e renderiza numa resolução bem alta pra não perder os números
// pequenos (CPF, nº de registro) nem o texto em vermelho do cartão.
async function ocrArquivo(file){
  if(typeof Tesseract === 'undefined') return '';
  let worker = null;
  try{
    let fonteImagem = file;
    if(file.type === 'application/pdf'){
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      const pagina = await pdf.getPage(1);
      const viewport = pagina.getViewport({ scale: 4.5 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await pagina.render({ canvasContext: ctx, viewport }).promise;
      fonteImagem = canvas;
    }
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({ tessedit_pageseg_mode: '6' });
    const resultado = await worker.recognize(fonteImagem);
    return (resultado && resultado.data && resultado.data.text) || '';
  } catch(e){
    return '';
  } finally {
    if(worker) try{ await worker.terminate(); } catch(e){ /* ignora */ }
  }
}

// Campos específicos da CNH que valem a pena buscar "pelo rótulo" no texto
// lido (em vez de só listar todas as datas/números achados): o nº de
// registro e a validade, que na CNH aparecem em vermelho no layout oficial.
function normalizarTextoComEspacos(t){
  return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}

function extrairNumeroRegistroCNH(texto){
  const t = normalizarTextoComEspacos(texto);
  const idx = t.search(/N.?\s*REGISTRO/);
  if(idx === -1) return null;
  const trecho = t.slice(idx, idx + 80);
  // Pode ter o CPF (com pontos/traço) pelo caminho — pega o 1º bloco de
  // 8 a 11 dígitos corridos (o CPF nunca aparece assim, sempre com pontuação).
  const m = trecho.match(/\d{8,11}/);
  return m ? m[0] : null;
}

function extrairValidadeCNH(texto){
  const t = normalizarTextoComEspacos(texto);
  // No layout oficial, "DATA EMISSAO" e "VALIDADE" aparecem como rótulos em
  // sequência, seguidos logo abaixo pelas duas datas correspondentes na
  // mesma ordem — a 2ª data é a validade.
  const idx = t.search(/DATA\s*EMISS[AÃ]O/);
  if(idx !== -1){
    const trecho = t.slice(idx, idx + 150);
    const encontradas = trecho.match(/\d{2}\/\d{2}\/\d{4}/g);
    if(encontradas && encontradas.length >= 2) return encontradas[1];
  }
  // Sem o rótulo, fica a última alternativa: entre as datas encontradas, a
  // validade é a única que ainda está no futuro (nascimento/1ª habilitação/
  // emissão são sempre datas passadas).
  const todasDatas = t.match(/\d{2}\/\d{2}\/\d{4}/g) || [];
  const hoje = new Date();
  const futuras = todasDatas.filter(d => {
    const [dd, mm, yyyy] = d.split('/');
    return new Date(`${yyyy}-${mm}-${dd}`) > hoje;
  });
  return futuras.length ? futuras.sort().pop() : null;
}

// O texto lido guarda as quebras de linha originais do cartão — usamos isso
// pra achar o nome certo: ele fica na linha logo abaixo do rótulo "NOME E
// SOBRENOME" (a mesma linha também tem, mais adiante, a data de 1ª
// habilitação da coluna ao lado — por isso cortamos no primeiro número).
function extrairNomeCNH(texto){
  const linhas = (texto || '').split('\n').map(l => l.trim()).filter(Boolean);
  const idx = linhas.findIndex(l => normalizarTextoComEspacos(l).includes('SOBRENOME'));
  if(idx === -1 || idx + 1 >= linhas.length) return null;
  let linhaNome = linhas[idx + 1];
  const corte = linhaNome.search(/[0-9]/);
  if(corte !== -1) linhaNome = linhaNome.slice(0, corte);
  linhaNome = linhaNome.replace(/[^A-Za-zÀ-ÿ\s]/g, ' ').replace(/\s+/g, ' ').trim();
  if(linhaNome.split(' ').length < 2 || linhaNome.length < 5) return null;
  return linhaNome.toLowerCase().replace(/(^|\s)(\S)/g, (m, p1, p2) => p1 + p2.toUpperCase());
}

function extrairCpfCNH(texto){
  const t = normalizarTextoComEspacos(texto);
  const idx = t.search(/\bCPF\b/);
  if(idx === -1) return null;
  const trecho = t.slice(idx, idx + 60);
  const m = trecho.match(/\d{3}\.?\d{3}\.?\d{3}-?\d{2}/);
  return m ? m[0] : null;
}

// Chama a função de servidor que cria o login do motorista com segurança
// (a chave de acesso total do banco nunca fica no app — só dentro dessa
// função, que roda no Supabase). Precisa dela publicada lá antes de
// funcionar (ver instruções no arquivo da função).
async function criarMotoristaAutomatico(nome, cpf){
  try{
    const { data: sessaoAtual } = await sb.auth.getSession();
    const token = sessaoAtual && sessaoAtual.session ? sessaoAtual.session.access_token : null;
    if(!token) return { error: 'Sessão expirada — atualize a página e tente de novo.' };
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/criar-motorista-automatico`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ nome, cpf })
    });
    const dados = await resp.json();
    if(!resp.ok) return { error: (dados && dados.error) || 'Erro ao cadastrar motorista.' };
    return { motorista: dados };
  } catch(e){
    return { error: 'Erro ao cadastrar motorista: ' + e.message };
  }
}

async function processarUploadAutomatico(file){
  let texto = '';
  if(file.type === 'application/pdf'){
    try{ texto = await extrairTextoPdf(file); } catch(e){ texto = ''; }
  }
  let deteccao = detectarTipoDocumento(texto);
  const { data: motoristas } = await sb.from('usuario').select('id, nome').eq('papel', 'motorista').order('nome');
  const { data: veiculos } = await sb.from('veiculo').select('id, placa').order('placa');
  const { data: calendario } = await sb.from('calendario_licenciamento').select('final_placa, mes');
  let datas = texto ? extrairDatasPossiveis(texto) : [];

  let motoristaSugerido = deteccao.referenteA === 'motorista' ? encontrarMotoristaPorNome(texto, motoristas) : null;
  let veiculoSugerido = deteccao.referenteA === 'veiculo' ? encontrarVeiculoPorPlaca(texto, veiculos) : null;

  // Falta nome/placa ou validade? Documento provavelmente traz os dados só
  // como imagem (ex: CNH Digital) — tenta completar com OCR antes de mostrar
  // a tela de confirmação, pra já vir tudo pronto sempre que possível.
  const faltaInfo = !deteccao.tipo
    || (deteccao.referenteA === 'motorista' && !motoristaSugerido)
    || (deteccao.referenteA === 'veiculo' && !veiculoSugerido)
    || !datas.length;
  let usouOcr = false;
  if(faltaInfo){
    mostrarStatusOcr(true, 'Lendo o documento com reconhecimento de imagem...');
    const textoOcr = await ocrArquivo(file);
    mostrarStatusOcr(false);
    if(textoOcr){
      usouOcr = true;
      texto = texto + '\n' + textoOcr;
      deteccao = detectarTipoDocumento(texto);
      datas = extrairDatasPossiveis(texto);
      motoristaSugerido = deteccao.referenteA === 'motorista' ? encontrarMotoristaPorNome(texto, motoristas) : motoristaSugerido;
      veiculoSugerido = deteccao.referenteA === 'veiculo' ? encontrarVeiculoPorPlaca(texto, veiculos) : veiculoSugerido;
    }
  }

  const sugestaoCalendario = veiculoSugerido ? sugerirValidadePorPlaca(veiculoSugerido.placa, calendario) : null;

  // Na CNH, o nº de registro e a validade aparecem em vermelho no cartão —
  // busca eles especificamente pelo rótulo, em vez de só listar tudo que
  // achou, pra vir pronto igual já acontece com placa/nome.
  let numeroSugerido = null, validadeSugerida = null;
  if(deteccao.referenteA === 'motorista' && deteccao.tipo === 'CNH'){
    numeroSugerido = extrairNumeroRegistroCNH(texto);
    validadeSugerida = extrairValidadeCNH(texto);
  }

  // Motorista não está cadastrado ainda? Se der pra ler o nome dele direto
  // da CNH, cadastra ele sozinho (login + senha temporária) antes de seguir
  // pro documento — assim já entra tudo de uma vez, do jeito que o Thiago
  // pediu.
  if(deteccao.referenteA === 'motorista' && deteccao.tipo === 'CNH' && !motoristaSugerido){
    const nomeCNH = extrairNomeCNH(texto);
    const cpfCNH = extrairCpfCNH(texto);
    if(nomeCNH && validadeSugerida){
      mostrarStatusOcr(true, 'Motorista não encontrado — cadastrando automaticamente...');
      const resultadoCriacao = await criarMotoristaAutomatico(nomeCNH, cpfCNH);
      mostrarStatusOcr(false);
      if(resultadoCriacao.motorista){
        motoristaSugerido = { id: resultadoCriacao.motorista.usuarioId, nome: nomeCNH };
        motoristas.push(motoristaSugerido);
        await mostrarCredenciaisNovoMotorista(resultadoCriacao.motorista);
      } else if(resultadoCriacao.error){
        // Não trava o Thiago (segue pra confirmação manual), mas avisa o
        // motivo — assim dá pra saber se é a função que falta publicar, ou
        // outra coisa.
        alert('Não consegui cadastrar o motorista automaticamente: ' + resultadoCriacao.error);
      }
    } else {
      const motivo = !nomeCNH ? 'o nome' : 'a validade';
      alert('Não consegui ler ' + motivo + ' deste motorista automaticamente pra cadastrar ele sozinho — selecione manualmente abaixo (ou complete os dados e cadastre-o pela tela de Documentos > Cadastrar documentos > motorista).');
    }
  }

  // Confiança alta o bastante pra cadastrar sozinho, sem precisar perguntar?
  // Só quando o nome bate exato (não só por palavras parecidas), a placa foi
  // encontrada e a validade veio de um jeito confiável — senão, mostra a
  // tela de confirmação pra pessoa conferir/completar.
  const dataBrParaIso = (d) => { if(!d) return null; const [dd, mm, yyyy] = d.split('/'); return `${yyyy}-${mm}-${dd}`; };
  let podeSalvarAutomatico = false;
  let validadeAuto = null;
  if(deteccao.referenteA === 'motorista' && motoristaSugerido && nomeBateExato(texto, motoristaSugerido) && deteccao.tipo && validadeSugerida){
    podeSalvarAutomatico = true;
    validadeAuto = dataBrParaIso(validadeSugerida);
  } else if(deteccao.referenteA === 'veiculo' && veiculoSugerido && deteccao.tipo && (sugestaoCalendario || datas.length === 1)){
    podeSalvarAutomatico = true;
    validadeAuto = dataBrParaIso(sugestaoCalendario || datas[0]);
  }

  if(podeSalvarAutomatico){
    const referenteId = deteccao.referenteA === 'motorista' ? motoristaSugerido.id : veiculoSugerido.id;
    const nomeExibicao = deteccao.referenteA === 'motorista' ? motoristaSugerido.nome : veiculoSugerido.placa;
    const { error } = await salvarDocumentoNoBanco({
      referenteA: deteccao.referenteA, referenteId, tipo: deteccao.tipo,
      numero: numeroSugerido, validade: validadeAuto, file
    });
    if(!error){
      mostrarToast(`✅ ${deteccao.tipo} de ${nomeExibicao} cadastrado automaticamente`);
      loadDocumentos();
      return;
    }
    // Deu erro salvando sozinho — não trava o Thiago, cai pra tela de
    // confirmação normal pra ele conseguir salvar na mão.
  }

  mostrarRevisaoDocumento({ file, deteccao, motoristas, veiculos, motoristaSugerido, veiculoSugerido, datas, sugestaoCalendario, usouOcr, numeroSugerido, validadeSugerida });
}

function sugerirValidadePorPlaca(placa, calendario){
  if(!placa || !calendario || !calendario.length) return null;
  const digitos = (placa || '').replace(/[^0-9]/g, '');
  if(!digitos.length) return null;
  const finalPlaca = parseInt(digitos[digitos.length - 1], 10);
  const linha = calendario.find(c => c.final_placa === finalPlaca);
  if(!linha) return null;
  const hoje = new Date();
  let ano = hoje.getFullYear();
  let dataFinal = new Date(ano, linha.mes, 0);
  if(dataFinal < hoje){ ano += 1; dataFinal = new Date(ano, linha.mes, 0); }
  const dd = String(dataFinal.getDate()).padStart(2, '0');
  const mm = String(linha.mes).padStart(2, '0');
  return `${dd}/${mm}/${ano}`;
}

function mostrarRevisaoDocumento(ctx){
  const { file, deteccao, motoristas, veiculos, motoristaSugerido, veiculoSugerido, datas, sugestaoCalendario, usouOcr, numeroSugerido, validadeSugerida } = ctx;
  let referenteA = deteccao.referenteA || 'empresa';
  const outrasDatas = validadeSugerida ? datas.filter(d => d !== validadeSugerida) : datas;

  const modalHtml = `
    <div id="uploadModal" style="position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; display:flex; align-items:flex-end;">
      <div style="background:var(--asphalt-900); width:100%; border-radius:16px 16px 0 0; padding:20px; max-height:85vh; overflow:auto;">
        <h3 style="margin-top:0;">Confirme o documento</h3>
        ${deteccao.tipo
          ? `<div class="l2" style="margin-bottom:14px;">Detectei: <b>${deteccao.tipo}</b>${motoristaSugerido ? ' de ' + motoristaSugerido.nome : ''}${veiculoSugerido ? ' do veículo ' + veiculoSugerido.placa : ''}${(deteccao.referenteA==='motorista' && !motoristaSugerido) || (deteccao.referenteA==='veiculo' && !veiculoSugerido) ? ' — não identifiquei de quem é, selecione abaixo' : ''}${usouOcr ? ' <span class="pill ok" style="margin-left:0;">lido por imagem</span>' : ''}</div>`
          : `<div class="l2" style="margin-bottom:14px;">Não consegui identificar automaticamente este arquivo — preencha abaixo.</div>`}

        <select id="revisaoReferenteA">
          <option value="empresa" ${referenteA==='empresa'?'selected':''}>Documento da empresa</option>
          <option value="motorista" ${referenteA==='motorista'?'selected':''}>Documento de motorista</option>
          <option value="veiculo" ${referenteA==='veiculo'?'selected':''}>Documento de veículo</option>
        </select>

        <div id="revisaoReferenteIdWrap" style="margin-top:10px;"></div>

        <input type="text" id="revisaoTipo" placeholder="Tipo (ex: CNH, CRLV)" value="${deteccao.tipo || ''}" style="margin-top:10px;">
        <input type="text" id="revisaoNumero" placeholder="Número (opcional)" value="${numeroSugerido || ''}" style="margin-top:10px;">

        ${sugestaoCalendario ? `
          <div class="l2" style="margin-top:14px;">Sugestão pelo calendário do Detran (final da placa):</div>
          <button class="ans-btn ok" data-data="${sugestaoCalendario}" style="flex:none; padding:8px 12px; margin-top:6px;" type="button">${sugestaoCalendario}</button>
        ` : ''}
        ${validadeSugerida ? `
          <div class="l2" style="margin-top:14px;">Validade encontrada no documento:</div>
          <button class="ans-btn ok active" data-data="${validadeSugerida}" style="flex:none; padding:8px 12px; margin-top:6px;" type="button">${validadeSugerida}</button>
        ` : ''}
        ${outrasDatas.length ? `
          <div class="l2" style="margin-top:14px;">${validadeSugerida ? 'Outras datas encontradas no arquivo:' : 'Datas encontradas no arquivo — toque na que for a validade:'}</div>
          <div id="revisaoDatas" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
            ${outrasDatas.map(d => `<button class="ans-btn" data-data="${d}" style="flex:none; padding:8px 12px;" type="button">${d}</button>`).join('')}
          </div>
        ` : ''}
        <input type="date" id="revisaoValidade" value="${(() => { if(!validadeSugerida) return ''; const [dd,mm,yyyy]=validadeSugerida.split('/'); return `${yyyy}-${mm}-${dd}`; })()}" style="margin-top:10px;">

        <button id="btnSalvarUploadAutomatico" style="margin-top:16px; width:100%;">Salvar documento</button>
        <button class="btn-small" id="btnCancelarUploadAutomatico" style="margin-top:8px; width:100%;">Cancelar</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);

  function renderReferenteIdSelect(){
    const wrap = document.getElementById('revisaoReferenteIdWrap');
    if(referenteA === 'motorista'){
      wrap.innerHTML = `<select id="revisaoReferenteId">
        <option value="">Selecione o motorista</option>
        ${(motoristas||[]).map(m => `<option value="${m.id}" ${motoristaSugerido && motoristaSugerido.id===m.id ? 'selected':''}>${m.nome}</option>`).join('')}
      </select>`;
    } else if(referenteA === 'veiculo'){
      wrap.innerHTML = `<select id="revisaoReferenteId">
        <option value="">Selecione o veículo</option>
        ${(veiculos||[]).map(v => `<option value="${v.id}" ${veiculoSugerido && veiculoSugerido.id===v.id ? 'selected':''}>${v.placa}</option>`).join('')}
      </select>`;
    } else {
      wrap.innerHTML = '';
    }
  }
  renderReferenteIdSelect();

  document.getElementById('revisaoReferenteA').addEventListener('change', (e) => { referenteA = e.target.value; renderReferenteIdSelect(); });
  document.querySelectorAll('[data-data]').forEach(btn => btn.addEventListener('click', () => {
    const [dd, mm, yyyy] = btn.dataset.data.split('/');
    document.getElementById('revisaoValidade').value = `${yyyy}-${mm}-${dd}`;
    document.querySelectorAll('[data-data]').forEach(b => b.classList.remove('active', 'ok'));
    btn.classList.add('active', 'ok');
  }));

  function fechar(){ const m = document.getElementById('uploadModal'); if(m) m.remove(); }
  document.getElementById('btnCancelarUploadAutomatico').addEventListener('click', fechar);

  document.getElementById('btnSalvarUploadAutomatico').addEventListener('click', async () => {
    const btn = document.getElementById('btnSalvarUploadAutomatico');
    const referenteIdEl = document.getElementById('revisaoReferenteId');
    const referenteId = referenteA === 'empresa' ? usuarioAtual.transportadora_id : (referenteIdEl ? referenteIdEl.value : null);
    const tipo = document.getElementById('revisaoTipo').value.trim();
    const numero = document.getElementById('revisaoNumero').value.trim();
    const validade = document.getElementById('revisaoValidade').value;

    if(!tipo){ alert('Informe o tipo do documento.'); return; }
    if(referenteA !== 'empresa' && !referenteId){ alert('Selecione a quem este documento pertence.'); return; }

    btn.disabled = true; btn.textContent = 'Salvando...';

    const { error, docId } = await salvarDocumentoNoBanco({ referenteA, referenteId, tipo, numero, validade, file });

    if(error && !docId){ alert('Erro ao criar o documento: ' + error.message); btn.disabled = false; btn.textContent = 'Salvar documento'; return; }
    if(error){ alert('Documento criado, mas não consegui enviar o arquivo: ' + error.message); fechar(); loadDocumentos(); return; }

    fechar();
    loadDocumentos();
  });
}

async function verArquivo(docId, docs){
  const doc = (docs||[]).find(d => String(d.id) === String(docId));
  if(!doc || !doc.arquivo_url) return;
  const { data, error } = await sb.storage.from('documentos').createSignedUrl(doc.arquivo_url, 300);
  if(error){ alert('Erro ao abrir arquivo: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

init();
</script>
