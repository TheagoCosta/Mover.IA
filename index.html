<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MOVER.IA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --asphalt-900:#14181d; --asphalt-800:#1b2027; --asphalt-700:#242b33;
    --line-yellow:#ffc53d; --line-yellow-dim:#8a6a1f;
    --text-primary:#edeef0; --text-secondary:#8b929c;
    --border:#2c333c; --danger:#e35a5e;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--asphalt-900); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding-inline:0;}
  .wrap{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px;}
  .logo{font-weight:800; font-size:26px; letter-spacing:.02em; margin-bottom:4px;}
  .logo span{color:var(--line-yellow-dim);}
  .tag{color:var(--text-secondary); font-size:13px; margin-bottom:28px; text-align:center;}
  form{width:100%; display:flex; flex-direction:column; gap:12px;}
  input,select{background:var(--asphalt-800); border:1px solid var(--border); color:var(--text-primary); border-radius:10px; padding:13px 14px; font-size:15px; width:100%;}
  input:focus,select:focus{outline:none; border-color:var(--line-yellow);}
  button{background:var(--line-yellow); color:#241c04; border:none; border-radius:10px; padding:13px 14px; font-size:15px; font-weight:700; cursor:pointer;}
  button:disabled{opacity:.6; cursor:default;}
  .err{color:var(--danger); font-size:13.5px; min-height:18px;}
  .top{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); padding-top:calc(16px + env(safe-area-inset-top, 0px));}
  .top .co{font-size:15px; font-weight:700;}
  .top .role{color:var(--text-secondary); font-size:12.5px; margin-top:2px;}
  .sair{background:transparent; color:var(--text-secondary); border:1px solid var(--border); padding:8px 12px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;}
  .content{padding:18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); flex:1;}
  h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--line-yellow); margin:22px 0 10px; font-weight:700;}
  h3:first-child{margin-top:0;}
  .card{background:var(--asphalt-800); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:8px;}
  .card .l1{font-weight:700; font-size:14.5px; display:flex; align-items:center;}
  .card .l2{color:var(--text-secondary); font-size:13px; margin-top:2px;}
  .pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:100px; background:var(--asphalt-700); color:var(--text-secondary); margin-left:8px; font-weight:600;}
  .pill.ok{background:rgba(63,178,127,.15); color:#3fb27f;}
  .pill.vence_em_breve{background:rgba(255,197,61,.15); color:var(--line-yellow);}
  .pill.vencido{background:rgba(227,90,94,.15); color:var(--danger);}
  .status{color:var(--text-secondary); font-size:14px; text-align:center; padding:40px 20px;}
  .tabs{display:flex; gap:4px; padding:0 20px; border-bottom:1px solid var(--border);}
  .tab{background:transparent; border:none; color:var(--text-secondary); font-size:13.5px; font-weight:600; padding:12px 4px; cursor:pointer; border-bottom:2px solid transparent; border-radius:0;}
  .tab.active{color:var(--line-yellow); border-bottom-color:var(--line-yellow);}
  .card .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .btn-small{background:var(--asphalt-700); color:var(--text-primary); border:1px solid var(--border); padding:8px 12px; font-size:12.5px; font-weight:600; border-radius:8px; cursor:pointer;}
  .file-label{background:var(--asphalt-700); color:var(--text-primary); border:1px solid var(--border); padding:8px 12px; font-size:12.5px; font-weight:600; border-radius:8px; cursor:pointer; display:inline-block;}
  .file-label input{display:none;}
  .card.clickable{cursor:pointer;}
  .backbtn{background:transparent; border:none; color:var(--text-secondary); font-size:13.5px; font-weight:600; padding:4px 0; margin-bottom:6px; cursor:pointer;}
  .ans-row{display:flex; gap:6px; margin-top:10px;}
  .ans-btn{flex:1; background:var(--asphalt-700); border:1px solid var(--border); color:var(--text-secondary); font-size:11.5px; font-weight:600; padding:9px 4px; border-radius:8px; cursor:pointer; text-align:center;}
  .ans-btn.active.ok{background:#3fb27f; border-color:#3fb27f; color:#fff;}
  .ans-btn.active.bad{background:var(--danger); border-color:var(--danger); color:#fff;}
  .ans-btn.active.na{background:#b9a9e8; border-color:#b9a9e8; color:#2c2440;}
  .progress{position:sticky; top:0; background:var(--asphalt-900); padding:12px 0; margin-top:-4px; z-index:2; border-bottom:1px solid var(--border); margin-bottom:12px;}
  .list-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .li-ic{width:34px; height:34px; border-radius:9px; background:var(--asphalt-700); display:flex; align-items:center; justify-content:center; color:var(--line-yellow); flex-shrink:0;}
  .li-body{flex:1; min-width:0;}
  .li-title{color:var(--text-primary); font-size:13.5px; font-weight:700;}
  .li-sub{color:var(--text-secondary); font-size:12px; margin-top:1px;}
  .chev{color:var(--text-secondary); font-size:18px;}
</style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = 'https://otllslhjbyjtktxyvezy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eFeBsxW2lThWWBAHquuv5g_NWe9lgvf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let loginError = '';
let usuarioAtual = null;
let screen = 'painel';

const app = document.getElementById('app');

async function init(){
  app.innerHTML = `<div class="wrap"><div class="status">Carregando...</div></div>`;
  const { data } = await sb.auth.getSession();
  session = data.session;
  render();
}

function render(){
  if(!session){ app.innerHTML = loginScreen(); attachLoginHandlers(); }
  else { app.innerHTML = `<div class="wrap"><div class="status">Carregando painel...</div></div>`; loadShell(); }
}

function loginScreen(){
  return `
  <div class="wrap">
    <div class="center">
      <div class="logo">MOVER<span>.IA</span></div>
      <div class="tag">Gestão para quem move o Brasil</div>
      <form id="loginForm">
        <input type="email" id="email" placeholder="E-mail" required autocomplete="username">
        <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
        <div class="err" id="loginErr">${loginError}</div>
        <button type="submit" id="loginBtn">Entrar</button>
      </form>
    </div>
  </div>`;
}

function attachLoginHandlers(){
  document.getElementById('loginForm').addEventListener('submit', doLogin);
}

async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    loginError = error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message;
    render();
    return;
  }
  loginError = '';
  session = data.session;
  render();
}

async function doLogout(){
  await sb.auth.signOut();
  session = null;
  usuarioAtual = null;
  meuConjunto = null;
  motoristaScreen = 'home';
  chkAnswers = {};
  screen = 'painel';
  render();
}

const papelLabel = { admin_transportadora:'Administrador', gestor:'Escritório', mecanico:'Mecânico', motorista:'Motorista', admin_mover_ia:'MOVER.IA' };
const statusLabel = { ok:'Em dia', vence_em_breve:'Vence em breve', vencido:'Vencido' };

async function loadShell(){
  if(!usuarioAtual){
    const { data: usuario, error: uErr } = await sb
      .from('usuario')
      .select('nome, papel, transportadora_id, transportadora:transportadora_id ( nome_fantasia, plano )')
      .eq('id', session.user.id)
      .single();

    if(uErr || !usuario){
      app.innerHTML = `<div class="wrap"><div class="content"><div class="status">Login funcionou, mas não encontrei seu cadastro na tabela "usuario". ${uErr ? '('+uErr.message+')' : ''}</div></div></div>`;
      return;
    }
    usuarioAtual = usuario;
  }

  if(usuarioAtual.papel === 'motorista'){ loadShellMotorista(); return; }

  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <div class="co">${usuarioAtual.transportadora ? usuarioAtual.transportadora.nome_fantasia : '—'}</div>
          <div class="role">${usuarioAtual.nome} · ${papelLabel[usuarioAtual.papel] || usuarioAtual.papel}</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="tabs">
        <button class="tab ${screen==='painel'?'active':''}" data-screen="painel">Painel</button>
        <button class="tab ${screen==='documentos'?'active':''}" data-screen="documentos">Documentos</button>
      </div>
      <div class="content" id="screenContent"><div class="status">Carregando...</div></div>
    </div>`;

  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    screen = el.dataset.screen;
    loadShell();
  }));

  if(screen === 'painel') loadPainel();
  else if(screen === 'documentos') loadDocumentos();
}

let meuConjunto = null;
let motoristaScreen = 'home';
let chkAnswers = {};
let chkObs = {};

async function carregarMeuConjunto(){
  if(meuConjunto !== null) return meuConjunto;
  const { data: conjuntos } = await sb
    .from('conjunto')
    .select('id, conjunto_item(ordem, veiculo_id, veiculo:veiculo_id(placa, tipo))')
    .eq('motorista_id', session.user.id);
  meuConjunto = (conjuntos && conjuntos[0]) || false;
  return meuConjunto;
}

async function carregarJornadaAtiva(){
  const { data } = await sb.from('jornada')
    .select('id, inicio, status')
    .eq('motorista_id', session.user.id)
    .neq('status', 'encerrada')
    .order('inicio', { ascending: false })
    .limit(1);
  return (data && data[0]) || null;
}

const jornadaStatusLabel = { ativa: 'Em andamento', pausada: 'Pausada' };

function jornadaBotoes(jornada){
  if(!jornada) return `<button id="btnJornadaIniciar" style="margin-top:14px; width:100%;">Iniciar jornada</button>`;
  if(jornada.status === 'ativa') return `
    <div class="ans-row">
      <button class="ans-btn" id="btnJornadaPausar" style="flex:1;">Pausar</button>
      <button class="ans-btn bad" id="btnJornadaEncerrar" style="flex:1;">Encerrar</button>
    </div>`;
  return `
    <div class="ans-row">
      <button class="ans-btn ok" id="btnJornadaRetomar" style="flex:1;">Retomar</button>
      <button class="ans-btn bad" id="btnJornadaEncerrar" style="flex:1;">Encerrar</button>
    </div>`;
}

function attachJornadaHandlers(jornada){
  const ini = document.getElementById('btnJornadaIniciar');
  if(ini) ini.addEventListener('click', iniciarJornada);
  const pausar = document.getElementById('btnJornadaPausar');
  if(pausar) pausar.addEventListener('click', () => atualizarJornada(jornada.id, 'pausada', 'pausa'));
  const retomar = document.getElementById('btnJornadaRetomar');
  if(retomar) retomar.addEventListener('click', () => atualizarJornada(jornada.id, 'ativa', 'retomada'));
  const encerrar = document.getElementById('btnJornadaEncerrar');
  if(encerrar) encerrar.addEventListener('click', () => encerrarJornada(jornada.id));
}

async function iniciarJornada(){
  const { data, error } = await sb.from('jornada').insert({
    transportadora_id: usuarioAtual.transportadora_id,
    motorista_id: session.user.id,
    status: 'ativa'
  }).select('id').single();
  if(error){ alert('Erro ao iniciar jornada: ' + error.message); return; }
  await sb.from('jornada_evento').insert({ jornada_id: data.id, tipo: 'inicio' });
  loadShellMotorista();
}

async function atualizarJornada(jornadaId, novoStatus, tipoEvento){
  const { error } = await sb.from('jornada').update({ status: novoStatus }).eq('id', jornadaId);
  if(error){ alert('Erro: ' + error.message); return; }
  await sb.from('jornada_evento').insert({ jornada_id: jornadaId, tipo: tipoEvento });
  loadShellMotorista();
}

async function encerrarJornada(jornadaId){
  const { error } = await sb.from('jornada').update({ status: 'encerrada', fim: new Date().toISOString() }).eq('id', jornadaId);
  if(error){ alert('Erro: ' + error.message); return; }
  await sb.from('jornada_evento').insert({ jornada_id: jornadaId, tipo: 'fim' });
  loadShellMotorista();
}

async function carregarViagemAtual(){
  const { data } = await sb.from('viagem')
    .select('id, origem, destino, cte_numero, mdfe_numero, status')
    .eq('motorista_id', session.user.id)
    .eq('status', 'em_andamento')
    .order('criado_em', { ascending: false })
    .limit(1);
  return (data && data[0]) || null;
}

async function finalizarViagem(viagemId){
  const { error } = await sb.from('viagem').update({ status: 'concluida' }).eq('id', viagemId);
  if(error){ alert('Erro ao finalizar viagem: ' + error.message); return; }
  loadShellMotorista();
}

async function loadAbastecimentoMotorista(){
  const conjunto = await carregarMeuConjunto();
  const cavalo = conjunto ? [...conjunto.conjunto_item].find(ci => ci.ordem === 1) : null;

  const { data: historico } = await sb.from('abastecimento')
    .select('id, data, km, litros, media_calculada')
    .eq('motorista_id', session.user.id)
    .order('data', { ascending: false })
    .limit(10);

  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <button class="backbtn" id="btnVoltar">← Voltar</button>
          <div class="co">Abastecimento</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="content">
        <h3>Registrar abastecimento</h3>
        <div class="card">
          ${cavalo ? `
            <form id="formAbastecimento">
              <input type="number" step="0.1" inputmode="decimal" id="abKm" placeholder="Km do veículo" required>
              <input type="number" step="0.01" inputmode="decimal" id="abLitros" placeholder="Litros abastecidos" required>
              <input type="number" step="0.1" inputmode="decimal" id="abOdometro" placeholder="Odômetro da bomba (opcional)">
              <button type="submit">Salvar abastecimento</button>
            </form>
          ` : '<div class="status">Você precisa estar vinculado a um conjunto para registrar abastecimento</div>'}
        </div>

        <h3>Últimos abastecimentos</h3>
        ${(historico||[]).map(a => `
          <div class="card">
            <div class="l1">${new Date(a.data).toLocaleDateString('pt-BR')}${a.media_calculada ? `<span class="pill ok">${Number(a.media_calculada).toFixed(2)} km/l</span>` : ''}</div>
            <div class="l2">${a.km} km · ${a.litros} L</div>
          </div>
        `).join('') || '<div class="status">Nenhum abastecimento registrado ainda</div>'}
      </div>
    </div>`;

  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.getElementById('btnVoltar').addEventListener('click', () => { motoristaScreen = 'home'; loadShellMotorista(); });
  const form = document.getElementById('formAbastecimento');
  if(form) form.addEventListener('submit', (e) => salvarAbastecimento(e, cavalo.veiculo_id));
}

async function salvarAbastecimento(e, veiculoId){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Salvando...';

  const km = parseFloat(document.getElementById('abKm').value);
  const litros = parseFloat(document.getElementById('abLitros').value);
  const odometroVal = document.getElementById('abOdometro').value;
  const odometro = odometroVal ? parseFloat(odometroVal) : null;

  const { data: anterior } = await sb.from('abastecimento')
    .select('km')
    .eq('veiculo_id', veiculoId)
    .order('data', { ascending: false })
    .limit(1);

  let media = null;
  if(anterior && anterior[0] && km > anterior[0].km && litros > 0){
    media = (km - anterior[0].km) / litros;
  }

  const { error } = await sb.from('abastecimento').insert({
    transportadora_id: usuarioAtual.transportadora_id,
    motorista_id: session.user.id,
    veiculo_id: veiculoId,
    km,
    litros,
    odometro_bomba: odometro,
    media_calculada: media
  });

  if(error){ alert('Erro ao salvar abastecimento: ' + error.message); btn.disabled = false; btn.textContent = 'Salvar abastecimento'; return; }

  alert(media ? `Abastecimento salvo! Consumo médio: ${media.toFixed(2)} km/l` : 'Abastecimento salvo!');
  loadShellMotorista();
}

function formatarDuracao(inicioIso, fimIso){
  const ms = new Date(fimIso) - new Date(inicioIso);
  const totalMin = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h${String(m).padStart(2,'0')}`;
}

async function loadHistoricoJornadas(){
  const { data: jornadas, error } = await sb.from('jornada')
    .select('id, inicio, fim')
    .eq('motorista_id', session.user.id)
    .eq('status', 'encerrada')
    .order('inicio', { ascending: false })
    .limit(20);

  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <button class="backbtn" id="btnVoltar">← Voltar</button>
          <div class="co">Histórico de jornadas</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="content">
        ${error ? `<div class="status">Erro ao carregar histórico: ${error.message}</div>` : ''}
        ${(jornadas||[]).map(j => `
          <div class="card">
            <div class="l1">${new Date(j.inicio).toLocaleDateString('pt-BR')}${j.fim ? `<span class="pill ok">${formatarDuracao(j.inicio, j.fim)}</span>` : ''}</div>
            <div class="l2">${new Date(j.inicio).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} até ${j.fim ? new Date(j.fim).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—'}</div>
          </div>
        `).join('') || '<div class="status">Nenhuma jornada encerrada ainda</div>'}
      </div>
    </div>`;
  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.getElementById('btnVoltar').addEventListener('click', () => { motoristaScreen = 'home'; loadShellMotorista(); });
}

function iconeVeiculo(tipo){
  if(tipo === 'cavalo') return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h13v13H1z"/><path d="M14 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="1.5"/><circle cx="17.5" cy="18.5" r="1.5"/></svg>`;
  if(tipo === 'dolly') return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="1"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>`;
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="10" rx="1"/><circle cx="6.5" cy="19" r="2"/><circle cx="17.5" cy="19" r="2"/></svg>`;
}

function labelPosicaoConjunto(ordem, tipo){
  if(tipo === 'cavalo') return 'Cavalo mecânico';
  if(tipo === 'dolly') return 'Dolly';
  if(tipo === 'carreta') return ordem <= 2 ? '1ª Carreta' : '2ª Carreta';
  return tipoLabelGlobal[tipo] || tipo;
}
const tipoLabelGlobal = { cavalo:'Cavalo', carreta:'Carreta', dolly:'Dolly' };

async function loadShellMotorista(){
  if(motoristaScreen === 'checklist'){ loadChecklistMotorista(); return; }
  if(motoristaScreen === 'historicoJornada'){ loadHistoricoJornadas(); return; }
  if(motoristaScreen === 'abastecimento'){ loadAbastecimentoMotorista(); return; }

  const conjunto = await carregarMeuConjunto();
  const jornada = await carregarJornadaAtiva();
  const viagem = await carregarViagemAtual();
  const { data: itens } = await sb.from('checklist_item_padrao').select('id').eq('ativo', true);
  const veiculosOrdenados = conjunto ? [...conjunto.conjunto_item].sort((a,b)=>a.ordem-b.ordem) : [];

  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <div class="co">${usuarioAtual.transportadora ? usuarioAtual.transportadora.nome_fantasia : '—'}</div>
          <div class="role">${usuarioAtual.nome} · ${papelLabel[usuarioAtual.papel] || usuarioAtual.papel}</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="content">
        <h3>Jornada</h3>
        <div class="card">
          <div class="l1">${jornada ? jornadaStatusLabel[jornada.status] : 'Nenhuma jornada aberta'}${jornada ? `<span class="pill ${jornada.status==='ativa'?'ok':'vence_em_breve'}">${jornada.status==='ativa'?'Ativa':'Pausada'}</span>` : ''}</div>
          ${jornada ? `<div class="l2">Iniciada às ${new Date(jornada.inicio).toLocaleString('pt-BR')}</div>` : ''}
          ${jornadaBotoes(jornada)}
        </div>
        <div class="card clickable" id="btnHistoricoJornada">
          <div class="l1">Histórico de jornadas</div>
          <div class="l2">Toque para ver jornadas anteriores</div>
        </div>

        <h3>Viagem atual</h3>
        <div class="card">
          ${viagem ? `
            <div class="l1">${viagem.origem || '—'} → ${viagem.destino || '—'}</div>
            <div class="l2">${[viagem.cte_numero ? 'CT-e '+viagem.cte_numero : '', viagem.mdfe_numero ? 'MDF-e '+viagem.mdfe_numero : ''].filter(Boolean).join(' · ') || 'Sem número de CT-e/MDF-e informado'}</div>
            <button id="btnFinalizarViagem" style="margin-top:10px; width:100%;">Finalizar viagem</button>
          ` : '<div class="l2">Nenhuma viagem em andamento — aguarde o escritório abrir uma nova viagem para você</div>'}
        </div>

        <h3>Meu conjunto</h3>
        ${veiculosOrdenados.length
          ? `<div class="card" style="padding:2px 14px;">${veiculosOrdenados.map(v => `
              <div class="list-item" data-placa="${v.veiculo.placa}">
                <div class="li-ic">${iconeVeiculo(v.veiculo.tipo)}</div>
                <div class="li-body">
                  <div class="li-title">${v.veiculo.placa}</div>
                  <div class="li-sub">${labelPosicaoConjunto(v.ordem, v.veiculo.tipo)}</div>
                </div>
                <div class="chev">›</div>
              </div>
            `).join('')}</div>`
          : '<div class="status">Nenhum conjunto vinculado a você ainda</div>'}

        <h3>Checklist pré-viagem</h3>
        <div class="card clickable" id="btnAbrirChecklist">
          <div class="l1">${(itens||[]).length} itens no padrão da ${usuarioAtual.transportadora ? usuarioAtual.transportadora.nome_fantasia : 'empresa'}</div>
          <div class="l2">Toque para preencher</div>
        </div>

        <h3>Abastecimento</h3>
        <div class="card clickable" id="btnAbastecimento">
          <div class="l1">Registrar abastecimento</div>
          <div class="l2">Toque para lançar km e litros e ver o consumo médio</div>
        </div>
      </div>
    </div>`;
  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.getElementById('btnAbrirChecklist').addEventListener('click', () => { motoristaScreen = 'checklist'; loadShellMotorista(); });
  document.getElementById('btnHistoricoJornada').addEventListener('click', () => { motoristaScreen = 'historicoJornada'; loadShellMotorista(); });
  document.getElementById('btnAbastecimento').addEventListener('click', () => { motoristaScreen = 'abastecimento'; loadShellMotorista(); });
  document.querySelectorAll('.list-item[data-placa]').forEach(el => el.addEventListener('click', () => {
    alert(`${el.dataset.placa}\n\nDetalhes do veículo em breve.`);
  }));
  const btnFinalizarViagem = document.getElementById('btnFinalizarViagem');
  if(btnFinalizarViagem) btnFinalizarViagem.addEventListener('click', () => finalizarViagem(viagem.id));
  attachJornadaHandlers(jornada);
}

async function loadChecklistMotorista(){
  const conjunto = await carregarMeuConjunto();
  const { data: itens } = await sb.from('checklist_item_padrao').select('id, ordem, descricao, padrao_esperado').eq('ativo', true).order('ordem');

  const total = (itens||[]).length;
  const respondidos = Object.keys(chkAnswers).length;

  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div>
          <button class="backbtn" id="btnVoltar">← Voltar</button>
          <div class="co">Checklist pré-viagem</div>
        </div>
        <button class="sair" id="btnSair">Sair</button>
      </div>
      <div class="content">
        <div class="progress"><div class="l2">${respondidos}/${total} itens respondidos</div></div>
        ${(itens||[]).map(it => `
          <div class="card">
            <div class="l1">${it.ordem}. ${it.descricao}</div>
            <div class="l2">${it.padrao_esperado || ''}</div>
            <div class="ans-row" data-item="${it.id}">
              <button class="ans-btn ok ${chkAnswers[it.id]==='ok'?'active':''}" data-val="ok">Atende</button>
              <button class="ans-btn bad ${chkAnswers[it.id]==='bad'?'active':''}" data-val="bad">Não atende</button>
              <button class="ans-btn na ${chkAnswers[it.id]==='na'?'active':''}" data-val="na">N/A</button>
            </div>
          </div>
        `).join('')}
        <button id="btnEnviarChecklist" ${respondidos<total?'disabled':''}>Enviar checklist (${respondidos}/${total})</button>
      </div>
    </div>`;

  document.getElementById('btnSair').addEventListener('click', doLogout);
  document.getElementById('btnVoltar').addEventListener('click', () => { motoristaScreen = 'home'; loadShellMotorista(); });
  document.querySelectorAll('.ans-row').forEach(row => {
    row.querySelectorAll('.ans-btn').forEach(btn => btn.addEventListener('click', () => {
      chkAnswers[row.dataset.item] = btn.dataset.val;
      loadChecklistMotorista();
    }));
  });
  const btnEnviar = document.getElementById('btnEnviarChecklist');
  if(btnEnviar) btnEnviar.addEventListener('click', enviarChecklist);
}

async function enviarChecklist(){
  const btn = document.getElementById('btnEnviarChecklist');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const conjunto = await carregarMeuConjunto();
  const respostas = Object.keys(chkAnswers).map(itemId => ({ item_id: itemId, resposta: chkAnswers[itemId] }));

  const { error } = await sb.from('checklist').insert({
    transportadora_id: usuarioAtual.transportadora_id,
    motorista_id: session.user.id,
    conjunto_id: conjunto ? conjunto.id : null,
    respostas
  });

  if(error){ alert('Erro ao enviar checklist: ' + error.message); btn.disabled = false; btn.textContent = 'Tentar de novo'; return; }

  alert('Checklist enviado ao escritório!');
  chkAnswers = {};
  motoristaScreen = 'home';
  loadShellMotorista();
}

async function loadPainel(){
  const { data: veiculos } = await sb.from('veiculo').select('placa, tipo, modelo').order('tipo').order('placa');
  const { data: checklists } = await sb
    .from('checklist')
    .select('id, criado_em, respostas, motorista:motorista_id(nome)')
    .order('criado_em', { ascending: false })
    .limit(5);
  const { data: motoristas } = await sb.from('usuario').select('id, nome').eq('papel', 'motorista').order('nome');
  const { data: viagens } = await sb.from('viagem')
    .select('id, origem, destino, cte_numero, mdfe_numero, motorista:motorista_id(nome)')
    .eq('status', 'em_andamento')
    .order('criado_em', { ascending: false });
  const { data: abastecimentos } = await sb.from('abastecimento')
    .select('id, data, km, litros, media_calculada, motorista:motorista_id(nome), veiculo:veiculo_id(placa)')
    .order('data', { ascending: false })
    .limit(5);
  const cavalos = (veiculos||[]).filter(v=>v.tipo==='cavalo');

  document.getElementById('screenContent').innerHTML = `
    <h3>Frota (${cavalos.length} conjuntos)</h3>
    ${cavalos.map(v=>`<div class="card"><div class="l1">${v.placa}<span class="pill">cavalo</span></div><div class="l2">${v.modelo||''}</div></div>`).join('') || '<div class="status">Nenhum veículo cadastrado</div>'}

    <h3>Checklists recebidos (${(checklists||[]).length})</h3>
    ${(checklists||[]).map(c => {
      const naoAtende = (c.respostas||[]).filter(r => r.resposta === 'bad').length;
      return `<div class="card"><div class="l1">${c.motorista ? c.motorista.nome : '—'}${naoAtende ? `<span class="pill vencido">${naoAtende} irregularidade${naoAtende>1?'s':''}</span>` : `<span class="pill ok">OK</span>`}</div><div class="l2">${new Date(c.criado_em).toLocaleString('pt-BR')}</div></div>`;
    }).join('') || '<div class="status">Nenhum checklist recebido ainda</div>'}

    <h3>Viagens em andamento (${(viagens||[]).length})</h3>
    ${(viagens||[]).map(v => `
      <div class="card">
        <div class="l1">${v.motorista ? v.motorista.nome : '—'}</div>
        <div class="l2">${v.origem||'?'} → ${v.destino||'?'}${v.cte_numero?' · CT-e '+v.cte_numero:''}${v.mdfe_numero?' · MDF-e '+v.mdfe_numero:''}</div>
      </div>
    `).join('') || '<div class="status">Nenhuma viagem em andamento</div>'}

    <h3>Nova viagem</h3>
    <div class="card">
      <form id="formNovaViagem">
        <select id="novaViagemMotorista" required>
          <option value="">Selecione o motorista</option>
          ${(motoristas||[]).map(m=>`<option value="${m.id}">${m.nome}</option>`).join('')}
        </select>
        <input type="text" id="novaViagemOrigem" placeholder="Origem">
        <input type="text" id="novaViagemDestino" placeholder="Destino">
        <input type="text" id="novaViagemCte" placeholder="Número do CT-e (opcional)">
        <input type="text" id="novaViagemMdfe" placeholder="Número do MDF-e (opcional)">
        <button type="submit">Criar viagem</button>
      </form>
    </div>

    <h3>Últimos abastecimentos (${(abastecimentos||[]).length})</h3>
    ${(abastecimentos||[]).map(a => `
      <div class="card">
        <div class="l1">${a.motorista ? a.motorista.nome : '—'}${a.media_calculada ? `<span class="pill ok">${Number(a.media_calculada).toFixed(2)} km/l</span>` : ''}</div>
        <div class="l2">${a.veiculo ? a.veiculo.placa : ''} · ${a.km} km · ${a.litros} L · ${new Date(a.data).toLocaleDateString('pt-BR')}</div>
      </div>
    `).join('') || '<div class="status">Nenhum abastecimento registrado ainda</div>'}
  `;

  const formNovaViagem = document.getElementById('formNovaViagem');
  if(formNovaViagem) formNovaViagem.addEventListener('submit', criarViagem);
}

async function criarViagem(e){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const motoristaId = document.getElementById('novaViagemMotorista').value;
  const origem = document.getElementById('novaViagemOrigem').value.trim();
  const destino = document.getElementById('novaViagemDestino').value.trim();
  const cte = document.getElementById('novaViagemCte').value.trim();
  const mdfe = document.getElementById('novaViagemMdfe').value.trim();

  if(!motoristaId){ alert('Selecione o motorista.'); return; }
  btn.disabled = true; btn.textContent = 'Criando...';

  const { data: conjunto } = await sb.from('conjunto')
    .select('conjunto_item(ordem, veiculo_id)')
    .eq('motorista_id', motoristaId)
    .limit(1)
    .maybeSingle();
  const cavaloItem = conjunto && conjunto.conjunto_item ? conjunto.conjunto_item.find(ci => ci.ordem === 1) : null;

  const { error } = await sb.from('viagem').insert({
    transportadora_id: usuarioAtual.transportadora_id,
    motorista_id: motoristaId,
    veiculo_id: cavaloItem ? cavaloItem.veiculo_id : null,
    origem: origem || null,
    destino: destino || null,
    cte_numero: cte || null,
    mdfe_numero: mdfe || null,
    status: 'em_andamento'
  });

  if(error){ alert('Erro ao criar viagem: ' + error.message); btn.disabled = false; btn.textContent = 'Criar viagem'; return; }

  alert('Viagem criada!');
  loadPainel();
}

async function loadDocumentos(){
  const { data: docs, error } = await sb
    .from('documento')
    .select('id, tipo, numero, validade, status, arquivo_url')
    .eq('referente_a', 'empresa')
    .order('tipo');

  const el = document.getElementById('screenContent');
  if(error){ el.innerHTML = `<div class="status">Erro ao carregar documentos: ${error.message}</div>`; return; }

  el.innerHTML = `
    <h3>Documentos da empresa (${(docs||[]).length})</h3>
    ${(docs||[]).map(d => `
      <div class="card">
        <div class="l1">${d.tipo}<span class="pill ${d.status}">${statusLabel[d.status]||d.status}</span></div>
        <div class="l2">${d.numero || ''}${d.validade ? ' · válido até '+formatarData(d.validade) : ''}</div>
        <div class="row">
          ${d.arquivo_url
            ? `<button class="btn-small" data-ver="${d.id}">Ver arquivo</button>`
            : `<span class="l2">Nenhum arquivo anexado</span>`}
          <label class="file-label">${d.arquivo_url ? 'Substituir' : 'Anexar arquivo'}<input type="file" data-anexar="${d.id}"></label>
        </div>
      </div>
    `).join('') || '<div class="status">Nenhum documento cadastrado</div>'}
  `;

  el.querySelectorAll('[data-ver]').forEach(btn => btn.addEventListener('click', () => verArquivo(btn.dataset.ver, docs)));
  el.querySelectorAll('[data-anexar]').forEach(inp => inp.addEventListener('change', (e) => anexarArquivo(inp.dataset.anexar, e.target.files[0])));
}

function formatarData(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function sanitizarNomeArquivo(nome){
  return nome
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9.\-]/g, '_');
}

async function anexarArquivo(docId, file){
  if(!file) return;
  const el = document.getElementById('screenContent');
  const path = `${usuarioAtual.transportadora_id}/${docId}_${Date.now()}_${sanitizarNomeArquivo(file.name)}`;
  const { error: upErr } = await sb.storage.from('documentos').upload(path, file, { upsert: true });
  if(upErr){ alert('Erro ao enviar arquivo: ' + upErr.message); return; }
  const { error: updErr } = await sb.from('documento').update({ arquivo_url: path }).eq('id', docId);
  if(updErr){ alert('Arquivo enviado, mas não consegui atualizar o registro: ' + updErr.message); return; }
  loadDocumentos();
}

async function verArquivo(docId, docs){
  const doc = (docs||[]).find(d => String(d.id) === String(docId));
  if(!doc || !doc.arquivo_url) return;
  const { data, error } = await sb.storage.from('documentos').createSignedUrl(doc.arquivo_url, 300);
  if(error){ alert('Erro ao abrir arquivo: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

init();
</script>
